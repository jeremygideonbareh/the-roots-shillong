    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          if (localStorage.getItem('roots-motion') === 'off') d.classList.add('motion-off');
        } catch (e) {}
        if (window.matchMedia && matchMedia('(pointer: coarse)').matches) d.classList.add('touch');
        // failsafe: if the app never finishes booting, don't leave the page behind the loader
        setTimeout(function () {
          if (!d.classList.contains('is-loading')) return;
          d.classList.remove('is-loading');
          var l = document.querySelector('[data-loader]');
          if (l) l.style.display = 'none';
          document.body.style.overflow = '';
        }, 12000);
      })();
    </script>
